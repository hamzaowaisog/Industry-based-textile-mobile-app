name: Build Backend

on:
  push:
    branches:
      - 'hamzaTex/Qa'
    paths:
      - 'backend/**'
      - '.github/workflows/build-backend.yml'
  workflow_dispatch: {}

jobs:
  build:
    name: Build & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore packages
        run: dotnet restore
        working-directory: backend/HamzaTex.Api

      - name: Build
        run: dotnet build --no-restore --configuration Release
        working-directory: backend/HamzaTex.Api

      # ──────────────────────────────────────────────────────────────────────
      # DEPLOY — Railway, on push to hamzaTex/Qa (same branch as other CI).
      # EF migrations + admin seed run automatically on container startup
      # (Program.cs → dbContext.Database.Migrate() / SeedData.EnsureAdminUserAsync).
      # No extra migration step needed here.
      # ──────────────────────────────────────────────────────────────────────
      - name: Install Railway CLI
        run: |
          curl -fsSL cli.new | bash -s -- --yes
          echo "$HOME/.railway/bin" >> "$GITHUB_PATH"

      - name: Deploy to Railway
        run: railway up --service hamzatex-api --detach
        working-directory: backend/HamzaTex.Api
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
