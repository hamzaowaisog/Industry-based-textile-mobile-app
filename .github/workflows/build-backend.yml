name: Build Backend

on:
  push:
    branches:
      - 'hamzaTex/Qa'
    paths:
      - 'backend/**'

jobs:
  build:
    name: Build & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore packages
        run: dotnet restore
        working-directory: backend/HamzaTex.Api

      - name: Build
        run: dotnet build --no-restore --configuration Release
        working-directory: backend/HamzaTex.Api

      # ──────────────────────────────────────────────────────────────────────
      # DEPLOY — Railway, on push to hamzaTex/Qa (same branch as other CI).
      # EF migrations + admin seed run automatically on container startup
      # (Program.cs → dbContext.Database.Migrate() / SeedData.EnsureAdminUserAsync).
      # No extra migration step needed here.
      # ──────────────────────────────────────────────────────────────────────
      - name: Deploy to Railway
        uses: bervProject/railway-deploy@v1.4.0
        with:
          railway_token: ${{ secrets.RAILWAY_TOKEN }}
          service: hamzatex-api
