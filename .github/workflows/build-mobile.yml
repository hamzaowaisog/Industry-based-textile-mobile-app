name: Build Mobile App

on:
  push:
    tags:
      - 'v*-preview-*'
      - 'v*-production-*'

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse tag
        id: tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION=$(echo "$TAG" | sed 's/^v\([^-]*\)-.*/\1/')
          ENV=$(echo "$TAG" | sed 's/^v[^-]*-\([^-]*\)-.*/\1/')
          BUILD=$(echo "$TAG" | sed 's/.*-//')
          NOTES=$(git for-each-ref --format='%(contents)' "refs/tags/$TAG")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "env=$ENV"         >> $GITHUB_OUTPUT
          echo "build=$BUILD"     >> $GITHUB_OUTPUT
          {
            echo "notes<<NOTES_EOF"
            echo "$NOTES"
            echo "NOTES_EOF"
          } >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Patch app version and build number
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ steps.tag.outputs.build }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${{ steps.tag.outputs.version }}\"/" android/app/build.gradle

      - name: Build Android with EAS
        id: eas_build
        run: |
          BUILD_JSON=$(eas build \
            --platform android \
            --profile ${{ steps.tag.outputs.env }} \
            --non-interactive \
            --message "${{ steps.tag.outputs.notes }}" \
            --json)
          ARTIFACT_URL=$(echo "$BUILD_JSON" | jq -r '.[0].artifacts.buildUrl')
          echo "artifact_url=$ARTIFACT_URL" >> $GITHUB_OUTPUT
        env:
          API_URL: ${{ steps.tag.outputs.env == 'production' && secrets.API_URL_PRODUCTION || secrets.API_URL_PREVIEW }}
          ANDROID_RELEASE_STORE_FILE: android/app/hamzatex-release.keystore
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}

      - name: Download artifact from EAS
        run: curl -L "${{ steps.eas_build.outputs.artifact_url }}" -o app-release.apk

      - name: Distribute to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_ANDROID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_CREDENTIALS }}
          groups: testing-persons
          releaseNotes: ${{ steps.tag.outputs.notes }}
          file: frontend/app-release.apk

